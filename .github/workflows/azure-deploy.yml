name: Deploy MeritList to Azure

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      # Copy package.json/lock so the deployed folder is self-contained.
      # IMPORTANT: dist/ becomes the wwwroot ROOT once deployed, so the
      # start script must say "node server.js", not "node dist/server.js"
      # (that path only makes sense locally, next to the source tree).
      - name: Prepare deploy artifact
        run: |
          cp package.json dist/
          cp package-lock.json dist/
          sed -i 's#"start": "node dist/server.js"#"start": "node server.js"#' dist/package.json

      # Install prod-only deps directly into dist/, so the deployed
      # package is self-contained and doesn't depend on Azure/Oryx
      # correctly detecting and running its own build step.
      - name: Install production dependencies into dist
        run: |
          cd dist
          npm ci --omit=dev

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: dist
